spring.application.name=userservice
server.port=8082

# In-memory H2 by default so the app runs out of the box.
# Use --spring.profiles.active=mysql for MySQL (see application-mysql.properties).
spring.datasource.url=jdbc:h2:mem:ecom
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Login token validity in milliseconds (1 hour)
auth.token.validity-ms=3600000

# Password reset link validity in milliseconds (15 minutes) and where the link points
auth.reset-token.validity-ms=900000
auth.reset-link.base-url=http://localhost:8082/reset-password

# Notification Service (welcome and password reset emails). Leave empty to disable.
notificationservice.base-url=${NOTIFICATIONSERVICE_URL:http://localhost:8086}
# Shared secret for internal service-to-service calls (sending events; /internal/** endpoints). Never commit.
internal.api-token=${INTERNAL_API_TOKEN:}

# Comma-separated emails that are always given the ADMIN role (bootstrap for the first administrator)
auth.admin-emails=${ADMIN_EMAILS:}

# Domain events (HLD 3.6): published to Kafka by default; "rest" posts them to the Notification Service instead
events.transport=${EVENTS_TRANSPORT:kafka}
events.topic=ecom.user-events
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
# Fail fast if the broker is down, instead of blocking the request for 60 s
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.producer.properties.request.timeout.ms=3000
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.admin.operation-timeout=5s
