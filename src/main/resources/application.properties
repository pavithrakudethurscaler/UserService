spring.application.name=userservice
server.port=8082

# In-memory H2 by default so the app runs out of the box.
# Use --spring.profiles.active=mysql for MySQL (see application-mysql.properties).
spring.datasource.url=jdbc:h2:mem:ecom
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Login token validity in milliseconds (1 hour)
auth.token.validity-ms=3600000
